name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # Lint, typecheck, build and the test suite. The repository's own
  # `pnpm run ci` is not run here: it is the pre-commit hook's job, and the
  # checks that only it covers (`knip`, the artifact contract, the upstream
  # anchor check, the glossary check) are enforced at commit time.
  unit-test:
    uses: sxzz/workflows/.github/workflows/unit-test.yml@main

