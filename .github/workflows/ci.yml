name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  unit-test:
    uses: sxzz/workflows/.github/workflows/unit-test.yml@main

  # The repository's own `pnpm run ci`. The reusable workflow above covers lint,
  # typecheck, build and the test suite, but `knip`, the artifact contract, the
  # upstream-anchor check and the glossary check exist only in this script, and
  # its other caller is the pre-commit hook, which a committer can skip. This
  # job is what makes "`pnpm run ci` MUST pass" a repository rule rather than a
  # local habit.
  #
  # The submodule is required by `check:anchors`, which verifies every host DOM
  # anchor against the pinned upstream tree. That check fails loudly when the
  # tree is absent rather than passing vacuously, so the checkout brings it in.
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the full ci pipeline
        run: pnpm run ci

