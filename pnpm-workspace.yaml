ignoreWorkspaceRootCheck: true
catalogMode: prefer

minimumReleaseAgeExcludePrune: true
# The upstream DeepSeek Harness alpha line publishes faster than the release-age
# gate allows, and this package is written against one exact version of it.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

# `@deepseek-ai/dsh` is an optional peer that states the compatible runtime
# range read at install and boot time. It is deliberately not materialized: the
# CLI resolves the plugin against the running installation, and pulling a whole
# second DSH tree in would add native build scripts nothing here needs.
autoInstallPeers: false
shellEmulator: true

packages:
  - playground
  - docs
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalog:
  '@deepseek-ai/cordis': 4.0.5-alpha.2
  '@deepseek-ai/dsh-api-remotes': 0.2.1-rc.2
  '@deepseek-ai/dsh-api-session-controller': 0.2.1-rc.2
  '@deepseek-ai/dsh-api-workspace-files': 0.2.1-rc.2
  '@deepseek-ai/dsh-attachment': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-locale': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-store': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-attachment': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-chat': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-conversation': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-dockkit': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-primitives': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-renderer': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-sidebar-documentpreview': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-sidebar-right': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-slots': 0.2.1-rc.2
  '@deepseek-ai/dsh-util-workspace-path': 0.2.1-rc.2
  '@types/react': 18.3.12
  '@types/react-dom': 18.3.1
  react: 18.3.1
  react-dom: 18.3.1

catalogs:
  agentic:
    skills: ^1.7.2
  cli:
    '@antfu/eslint-config': ^9.5.1
    '@antfu/ni': ^30.6.0
    bumpp: ^12.3.0
    eslint: ^10.11.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.38.0
    nano-staged: ^1.0.2
    publint: ^0.3.24
    simple-git-hooks: ^2.14.0
    taze: ^21.2.0
    tsdown: ^0.23.0
    tsx: ^4.23.15
    typescript: ^6.0.3
    vite: ^8.3.1
  inlined:
    '@antfu/utils': ^9.3.0
  testing:
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.5.0
    vitest: ^5.0.2
  types:
    '@types/node': ^26.6.3
